### model
model_name_or_path: Qwen/Qwen2.5-0.5B-Instruct
trust_remote_code: true

### method
stage: sft # 告诉框架现在做的是监督微调
do_train: true
finetuning_type: lora # 使用低秩适配方法训练
lora_rank: 8 #r
lora_target: all #自动对合适的线性层应用LoRA

### dataset
dataset: gsm8k_sft_smoke
dataset_dir: data
template: qwen
cutoff_len: 1024 #tokenize后最多1024tokens, 超过就截断
overwrite_cache: true
preprocessing_num_workers: 4
dataloader_num_workers: 2

### output
output_dir: outputs/qwen25_05b_lora_sft_smoke
logging_steps: 5
save_steps: 100
plot_loss: true
overwrite_output_dir: true
report_to: none

### train
seed: 42
per_device_train_batch_size: 1
gradient_accumulation_steps: 8 #积累8个gradient才会optimizer.step()
learning_rate: 1.0e-4
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
