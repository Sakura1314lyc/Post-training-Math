### confirmatory v2: frozen split, seed 44
model_name_or_path: Qwen/Qwen2.5-Math-1.5B
trust_remote_code: true

### method
stage: sft
do_train: true
do_eval: true
finetuning_type: lora
lora_rank: 8
lora_alpha: 16
lora_target: q_proj,v_proj,lm_head

### frozen data protocol
dataset: gsm8k_confirmatory_train
eval_dataset: gsm8k_confirmatory_dev_select
dataset_dir: data/confirmatory_v2
template: qwen
cutoff_len: 1024
overwrite_cache: true
preprocessing_num_workers: 4
dataloader_num_workers: 2

### output
output_dir: outputs/confirmatory_v2/sft_seed44
logging_steps: 10
save_strategy: epoch
plot_loss: true
overwrite_output_dir: false
report_to: none

### train
seed: 44
data_seed: 44
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 2.0e-5
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_steps: 90
bf16: true

### selection evaluation only; dev_audit is intentionally absent
per_device_eval_batch_size: 1
eval_strategy: epoch
